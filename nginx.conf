server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    autoindex off;

    # Autoriser uniquement les téléchargements GET et HEAD
    location ~* \.sh$ {
        limit_except GET HEAD {
            deny all;
        }

        default_type text/plain;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "public, max-age=300" always;

        try_files $uri =404;
    }

    # Refuser tout autre chemin
    location / {
        return 404;
    }

    # Refuser les fichiers et répertoires cachés
    location ~ /\. {
        deny all;
    }
}
